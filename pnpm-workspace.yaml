packages:
  - packages/*
allowBuilds:
  esbuild: true
  koffi: true
overrides:
  # One physical instance of the shared transitive bases: without these pins
  # any freshly-added package re-resolves `^0.1.0-rc.X` to the newest rc on its
  # paths, splitting dsh-session into peer-suffix copies whose branded types
  # then fail assignability across package boundaries.
  '@deepseek-ai/dsh-attachment': 0.1.0-rc.8
  '@deepseek-ai/dsh-brand': 0.1.0-rc.8
  '@deepseek-ai/dsh-invariants': 0.1.0-rc.8
  '@deepseek-ai/dsh-scope': 0.1.0-rc.8
  '@deepseek-ai/dsh-timeout': 0.1.0-rc.8
  '@deepseek-ai/dsh-typert-protocol': 0.1.0-rc.8
