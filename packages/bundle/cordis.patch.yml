# The single-package layer: every task-center plugin row with deployment
# defaults. Storage rides the web profile's own rows (same dsh-home root), so
# this layer must NOT insert them — a second storage-domain would double-open
# the ledger; a fresh non-web profile adds the three storage rows itself (see
# the README). Users override any row by id in their profile's own
# cordis.patch.yml.
- insert:
    - id: tasks
      name: dsh-task-center/plugins/task
      config:
        contextPackByteLimit: 2000
        listDefaultLimit: 20
    - id: task-local
      name: dsh-task-center/plugins/task-local
      config: {}
    - id: task-source
      name: dsh-task-center/plugins/task-source
      config:
        pollSeconds: 30
        idleHours: 3
        agent:
          provider: deepseek-official
          model: !!js process.env.TASK_CENTER_MODEL ?? 'deepseek-v4-flash'
        summariesPerTick: 2
        transcriptEvents: 40
    - id: tool-task
      name: dsh-task-center/plugins/tool-task
      config: {}
    - id: command-task
      name: dsh-task-center/plugins/command-task
      config:
        staleDays: 3
    - id: task-wake
      name: dsh-task-center/plugins/task-wake
      config:
        pollSeconds: 30
        agent:
          provider: deepseek-official
          model: !!js process.env.TASK_CENTER_MODEL ?? 'deepseek-v4-flash'
        patrol:
          at: '09:30'
    - id: task-quota
      name: dsh-task-center/plugins/task-quota
      config: {}
    - id: task-reaper
      name: dsh-task-center/plugins/task-reaper
      config: {}
    # The bare package name is what the web host's client discovery resolves:
    # the row's entry name must be the package root for the kanban client
    # bundle to be served. The package's main export is this plugin.
    - id: task-web
      name: dsh-task-center
      config:
        staleDays: 3
    - id: task-sched
      name: dsh-task-center/plugins/task-sched
      config:
        pollSeconds: 30
        agent:
          provider: deepseek-official
          model: !!js process.env.TASK_CENTER_MODEL ?? 'deepseek-v4-flash'
