# The fresh-profile layer: the storage rows dsh-base does not carry (same
# dsh-home root as the web bundle, so profiles share one ledger) plus the
# core task-center plugin rows. task-web/task-sched stay out — they belong to
# the web profile. Users override any row by id in their profile's own
# cordis.patch.yml.
- insert:
    - id: storage
      name: '@deepseek-ai/dsh-storage'
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
        routes: {}
    - id: tasks
      name: dsh-task-center-task
      config:
        contextPackByteLimit: 2000
        listDefaultLimit: 20
    - id: task-local
      name: dsh-task-center-task-local
      config: {}
    - id: task-source
      name: dsh-task-center-task-source
      config:
        pollSeconds: 30
        idleHours: 3
        agent:
          provider: deepseek-official
          model: !!js process.env.TASK_CENTER_MODEL ?? 'deepseek-v4-flash'
        summariesPerTick: 2
        transcriptEvents: 40
    - id: tool-task
      name: dsh-task-center-tool-task
      config: {}
    - id: command-task
      name: dsh-task-center-command-task
      config:
        staleDays: 3
    - id: task-wake
      name: dsh-task-center-task-wake
      config:
        pollSeconds: 30
        agent:
          provider: deepseek-official
          model: !!js process.env.TASK_CENTER_MODEL ?? 'deepseek-v4-flash'
        patrol:
          at: '09:30'
    - id: task-quota
      name: dsh-task-center-task-quota
      config: {}
    - id: task-reaper
      name: dsh-task-center-task-reaper
      config: {}
