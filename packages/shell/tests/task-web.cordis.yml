# Web-board composition: the seam plus its RPC face, nothing else. The board
# service is a projection over ctx.tasks joined with the live holder sessions
# (idle freshness), so the session store rides along; no commands or resident
# plugins, and the spec drives the ledger directly.
- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: tasks
  name: 'dsh-task-center-task'
  config:
    contextPackByteLimit: 2000
    listDefaultLimit: 20

- id: task-web
  name: 'dsh-task-center-task-web'
  config:
    staleDays: 3
