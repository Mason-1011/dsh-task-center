<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SNAKE//808 — 贪吃蛇</title>
<style>
  /* ============ reset & base ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --bg-2: #0f1520;
    --panel: rgba(16, 22, 34, 0.72);
    --grid: rgba(80, 220, 180, 0.06);
    --line: rgba(120, 150, 190, 0.10);
    --ink: #d7e4ee;
    --ink-dim: #6c8096;
    --accent: #38f2b0;      /* phosphor mint */
    --accent-2: #22c9ff;    /* electric cyan   */
    --danger: #ff5d6c;      /* coral red        */
    --gold: #ffc857;        /* food amber       */
    --shadow: 0 0 18px rgba(56, 242, 176, 0.45);
  }

  html, body { height: 100%; }

  body {
    font-family: "Courier New", ui-monospace, "SFMono-Regular", Menlo, monospace;
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(34, 201, 255, 0.10), transparent 60%),
      radial-gradient(900px 700px at 10% 110%, rgba(56, 242, 176, 0.08), transparent 55%),
      var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    padding: 16px;
  }

  /* subtle scanline overlay */
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.015) 0 1px,
      transparent 1px 3px
    );
    mix-blend-mode: overlay;
    z-index: 50;
  }

  /* ============ cabinet ============ */
  .cabinet {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 22px 20px;
    backdrop-filter: blur(8px);
    box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    animation: rise 0.55s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ============ header ============ */
  .masthead {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .title {
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 22px rgba(56,242,176,0.25);
  }
  .title small {
    display: block;
    font-size: 11px; font-weight: 400; letter-spacing: 5px;
    color: var(--ink-dim); margin-top: 6px; text-transform: uppercase;
  }

  .stats { display: flex; gap: 10px; }
  .stat {
    min-width: 64px; text-align: center;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(10,14,20,0.5);
  }
  .stat b { display: block; font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .stat span { font-size: 9px; letter-spacing: 2px; color: var(--ink-dim); text-transform: uppercase; }
  .stat.score b { color: var(--accent); }
  .stat.best b { color: var(--gold); }
  .stat.level b { color: var(--accent-2); }

  /* ============ board ============ */
  .board-wrap { position: relative; margin-bottom: 14px; }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    border: 1px solid var(--line);
    background:
      radial-gradient(circle at 50% 40%, rgba(56,242,176,0.05), transparent 70%),
      var(--bg-2);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
    touch-action: none;
  }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: rgba(8,11,17,0.78);
    border-radius: 12px;
    backdrop-filter: blur(3px);
    text-align: center; padding: 20px;
    transition: opacity .25s ease;
    z-index: 10;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 {
    font-size: clamp(20px, 5vw, 26px); letter-spacing: 3px;
    color: var(--ink); font-weight: 800;
  }
  .overlay .sub { color: var(--ink-dim); font-size: 12px; letter-spacing: 1px; max-width: 30ch; line-height: 1.6; }
  .overlay .final { color: var(--danger); font-size: 14px; letter-spacing: 2px; }

  /* ============ buttons & d-pad ============ */
  .btn {
    font-family: inherit; cursor: pointer;
    border: 1px solid rgba(56,242,176,0.4);
    background: rgba(56,242,176,0.10);
    color: var(--accent);
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    padding: 11px 26px; border-radius: 999px;
    transition: transform .08s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:hover { background: rgba(56,242,176,0.18); box-shadow: var(--shadow); }
  .btn:active { transform: scale(0.95); }
  .btn.ghost { color: var(--ink-dim); border-color: var(--line); background: transparent; }
  .btn.ghost:hover { color: var(--ink); box-shadow: none; background: rgba(255,255,255,0.04); }

  .controls {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .kbd-hint { color: var(--ink-dim); font-size: 11px; letter-spacing: 1px; }
  .kbd-hint kbd {
    display: inline-block; padding: 2px 6px; margin: 0 2px;
    border: 1px solid var(--line); border-radius: 5px;
    background: rgba(255,255,255,0.04); color: var(--ink); font-family: inherit; font-size: 10px;
  }
  .actions { display: flex; gap: 8px; }

  .dpad {
    display: grid; grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(3, 48px); gap: 6px; justify-content: center;
    margin: 6px auto 0;
  }
  .dpad button {
    font-family: inherit; font-size: 18px; font-weight: 800;
    border: 1px solid var(--line); border-radius: 12px;
    background: rgba(255,255,255,0.03); color: var(--ink-dim);
    cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: transform .06s ease, background .15s ease, color .15s ease;
  }
  .dpad button:active { transform: scale(0.9); background: rgba(56,242,176,0.2); color: var(--accent); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 3; }

  footer { margin-top: 14px; text-align: center; color: var(--ink-dim); font-size: 10px; letter-spacing: 2px; }

  @media (max-width: 480px) { .dpad { display: grid; } .kbd-hint { display: none; } }
</style>
</head>
<body>
  <div class="cabinet">
    <header class="masthead">
      <h1 class="title">SNAKE//808
        <small>贪吃蛇 · ARCADIAN</small>
      </h1>
      <div class="stats">
        <div class="stat score"><b id="score">0</b><span>得分</span></div>
        <div class="stat best"><b id="best">0</b><span>最高</span></div>
        <div class="stat level"><b id="level">1</b><span>速度</span></div>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board"></canvas>

      <div class="overlay" id="startOverlay">
        <h2>READY?</h2>
        <p class="sub">方向键 / WASD 控制移动<br>吃下琥珀能量块 · 别撞墙也别咬自己</p>
        <button class="btn" id="startBtn">启动 ▶</button>
      </div>

      <div class="overlay hidden" id="overOverlay">
        <h2>GAME OVER</h2>
        <p class="final" id="overMsg">SCORE 000 · BEST 000</p>
        <button class="btn" id="againBtn">再来一局 ↻</button>
      </div>
    </div>

    <div class="controls">
      <span class="kbd-hint">
        <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        &nbsp;<kbd>SPACE</kbd> 暂停 &nbsp;<kbd>R</kbd> 重开
      </span>
      <div class="actions">
        <button class="btn ghost" id="pauseBtn">⏸ 暂停</button>
        <button class="btn ghost" id="resetBtn">↻ 重开</button>
      </div>
    </div>

    <div class="dpad" id="dpad" aria-label="触屏方向控制">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down" data-dir="down">▼</button>
    </div>

    <footer>INSERT COIN · 本地最高分自动保存</footer>
  </div>

<script>
(() => {
  "use strict";

  /* ---------- config ---------- */
  const GRID = 20;               // cells per side
  const BASE_MS = 160;           // starting tick (ms)
  const MIN_MS = 70;             // fastest tick
  const SPEED_STEP = 8;          // ms faster per level
  const LEVEL_EVERY = 4;         // food eaten per level-up

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  const $score = document.getElementById("score");
  const $best  = document.getElementById("best");
  const $level = document.getElementById("level");
  const startOv = document.getElementById("startOverlay");
  const overOv  = document.getElementById("overOverlay");
  const overMsg = document.getElementById("overMsg");

  let size = 0;                  // pixel size of one cell

  /* ---------- audio (tiny WebAudio blips) ---------- */
  let audioCtx = null;
  function blip(freq, dur, type = "square", gain = 0.05) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + dur);
    } catch (_) { /* audio unavailable — ignore */ }
  }

  /* ---------- state ---------- */
  let snake = [];               // [{x,y}] head first
  let dir = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };
  let food = null;
  let score = 0;
  let best = +(localStorage.getItem("snake808.best") || 0);
  let level = 1;
  let alive = false;            // running game
  let paused = false;
  let ended = false;            // terminal state (showing overlay)
  let raf = null;               // current draw frame id
  let timer = null;             // game loop timeout id

  $best.textContent = best;

  /* ---------- sizing ---------- */
  function fit() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    size = Math.floor((rect.width * dpr) / GRID);
    canvas.width = size * GRID;
    canvas.height = size * GRID;
    draw();
  }
  window.addEventListener("resize", fit);

  /* ---------- food ---------- */
  function spawnFood() {
    const occupied = new Set(snake.map(c => c.x + "," + c.y));
    const free = [];
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!occupied.has(x + "," + y)) free.push({ x, y });
    if (!free.length) { return null; }
    food = free[Math.floor(Math.random() * free.length)];
    return food;
  }

  /* ---------- reset ---------- */
  function reset() {
    const cy = Math.floor(GRID / 2);
    snake = [ { x: 8, y: cy }, { x: 7, y: cy }, { x: 6, y: cy } ];
    dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 };
    score = 0; level = 1;
    ended = false; paused = false;
    $score.textContent = "0";
    $level.textContent = "1";
    food = null;
    spawnFood();
  }

  /* ---------- game loop ---------- */
  function tick() {
    if (!alive || paused || ended) return;
    // apply queued direction (no reverse)
    if (!(nextDir.x === -dir.x && nextDir.y === -dir.y) &&
        (nextDir.x || nextDir.y)) dir = { ...nextDir };

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) { return gameOver(); }
    // self collision
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) { return gameOver(); }
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score++;
      $score.textContent = score;
      blip(520, 0.08, "square");
      if (score > best) { best = score; localStorage.setItem("snake808.best", best); $best.textContent = best; }
      if (score % LEVEL_EVERY === 0) { level++; $level.textContent = level; blip(720, 0.12, "triangle"); }
      if (!spawnFood()) { return win(); }       // board full → you win
    } else {
      snake.pop();                              // didn't eat → shrink tail
    }

    draw();
    schedule();
  }

  function schedule() {
    const ms = Math.max(MIN_MS, BASE_MS - (level - 1) * SPEED_STEP);
    clearTimeout(timer);
    timer = setTimeout(tick, ms);
  }

  /* ---------- terminal states ---------- */
  function gameOver() {
    ended = true; alive = false;
    clearTimeout(timer);
    blip(180, 0.35, "sawtooth", 0.06);
    overMsg.textContent = "SCORE " + String(score).padStart(3, "0") +
      " · BEST " + String(best).padStart(3, "0");
    overOv.classList.remove("hidden");
    draw();
  }

  function win() {
    ended = true; alive = false;
    clearTimeout(timer);
    blip(880, 0.15, "triangle"); setTimeout(() => blip(1100, 0.18, "triangle"), 120);
    overMsg.textContent = "BOARD CLEARED! SCORE " + score;
    overOv.classList.remove("hidden");
    draw();
  }

  /* ---------- start / pause ---------- */
  function start() {
    if (ended) reset();
    alive = true; paused = false;
    startOv.classList.add("hidden");
    overOv.classList.add("hidden");
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    blip(660, 0.08, "square");
    schedule();
  }

  function togglePause() {
    if (!alive || ended) return;
    paused = !paused;
    if (paused) { clearTimeout(timer); }
    else schedule();
    draw();
  }

  function setDir(nx, ny) {
    if (!alive || paused || ended) return;
    // don't allow reversing in place
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  /* ---------- rendering ---------- */
  function draw() {
    const s = size;
    // bg + grid
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0f1520";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(120,150,190,0.07)";
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * s + 0.5, 0); ctx.lineTo(i * s + 0.5, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * s + 0.5); ctx.lineTo(canvas.width, i * s + 0.5); ctx.stroke();
    }

    // food
    if (food) {
      const fx = food.x * s, fy = food.y * s, r = s * 0.42, cx = fx + s / 2, cy = fy + s / 2;
      const pulse = 1 + Math.sin(Date.now() / 220) * 0.08;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * pulse);
      g.addColorStop(0, "#ffe9a8");
      g.addColorStop(0.55, "#ffc857");
      g.addColorStop(1, "#ff9f2e");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath(); ctx.arc(cx - r * 0.28, cy - r * 0.28, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.shadowColor = "rgba(255,200,87,0.8)"; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // snake (head → tail), round joints
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    for (let i = snake.length - 1; i >= 0; i--) {
      const c = snake[i];
      const hue = 150 + (level % 6) * 8;
      const headGlow = i === 0 ? 18 : 6;
      const x = c.x * s + s / 2, y = c.y * s + s / 2;
      ctx.shadowColor = "rgba(56,242,176,0.5)";
      ctx.shadowBlur = i === 0 ? 18 : 4;
      ctx.fillStyle = i === 0
        ? "#5dffd0"
        : `hsla(${hue}, 90%, ${62 - Math.min(i, 6) * 3}%)`;
      ctx.beginPath(); ctx.arc(x, y, s * 0.42 - (i === 0 ? 0 : 2), 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;

    // head eyes
    if (snake.length) {
      const h = snake[0];
      const ex = h.x * s, ey = h.y * s, es = s / 2;
      const eyeOff = s * 0.16;
      const ex1 = ex + es + (dir.x || dir.y ? dir.x * eyeOff : 0) - (dir.y ? eyeOff : 0);
      const ey1 = ey + es + (dir.y ? dir.y * eyeOff : 0) - (dir.x ? eyeOff : 0);
      const ex2 = ex + es + (dir.x || dir.y ? dir.x * eyeOff : 0) + (dir.y ? eyeOff : 0);
      const ey2 = ey + es + (dir.y ? dir.y * eyeOff : 0) + (dir.x ? eyeOff : 0);
      ctx.fillStyle = "#0a0e14";
      ctx.beginPath(); ctx.arc(ex1, ey1, s * 0.09, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2, ey2, s * 0.09, 0, Math.PI * 2); ctx.fill();
    }

    // paused overlay
    if (paused && alive) {
      ctx.fillStyle = "rgba(8,11,17,0.55)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(56,242,176,0.9)";
      ctx.font = "800 " + (s * 2.2) + "px 'Courier New', monospace";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("⏸", canvas.width / 2, canvas.height / 2);
    }
  }

  /* keep food pulsing while alive */
  setInterval(() => { if (alive && !paused && !ended) draw(); }, 120);

  /* ---------- input ---------- */
  const KEYMAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };
  window.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "p" || e.key === "P") {
      if (alive) { e.preventDefault(); togglePause(); }
      return;
    }
    if (e.key === "r" || e.key === "R") { e.preventDefault(); start(); return; }
    if (KEYMAP[e.key]) { e.preventDefault(); setDir(KEYMAP[e.key][0], KEYMAP[e.key][1]); }
  });

  /* touch / mouse swipe */
  let t0 = null;
  const boardEl = document.getElementById("board");
  boardEl.addEventListener("touchstart", (e) => {
    const t = e.touches[0]; t0 = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  boardEl.addEventListener("touchend", (e) => {
    if (!t0) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - t0.x, dy = t.clientY - t0.y;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    t0 = null;
  }, { passive: true });

  /* d-pad buttons */
  const DPAD = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  document.querySelectorAll("#dpad button").forEach((b) => {
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); setDir(...DPAD[b.dataset.dir]); });
  });

  /* buttons */
  document.getElementById("startBtn").addEventListener("click", start);
  document.getElementById("againBtn").addEventListener("click", start);
  document.getElementById("pauseBtn").addEventListener("click", () => { if (alive) togglePause(); });
  document.getElementById("resetBtn").addEventListener("click", () => { if (alive || ended) start(); });

  /* ---------- boot ---------- */
  reset();
  fit();
  draw();

  /* test-only state hook (harmless: active only with #debug hash) */
  if (location.hash === "#debug") {
    window.__snake = {
      get state() { return { snake, dir, nextDir, food, score, level, alive, paused, ended, GRID }; },
      setFood(c) { food = c; },
    };
  }
})();
</script>
</body>
</html>
